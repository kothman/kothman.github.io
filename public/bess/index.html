      body {

      .container {
	  padding: 0 1rem;
      }
      .calendar {
	  width: 40rem;
	  max-width: 100%;
	  margin: auto;
	  padding-top: 2rem;
      }
      .calendar-spirals {
	  display: flex;
	  justify-content: space-around;
	  transform: translateY(2rem);
      }
      .calendar-spiral {
	  height: 4rem;
	  width: 4rem;
	  display: flex;
	  transform: rotate(240deg);
      }
      .calendar-page {
	  border: 1px solid black;
	  background-color: whitesmoke;
	  padding: 2rem;
          display: flex;
          flex-direction: column;
	  box-shadow: 0px 0px 12px 0px black;
      }
      .calendar-page-month {	      
	  font-size: 2rem;
	  text-transform: uppercase;
	  text-align: center;
      }
      .calendar-page-days {
	  margin: 2rem auto;
          display: flex;
          justify-content: center;
          flex-direction: column;
          flex: 0 1 auto;
          border: 4px solid cornflowerblue;
	  border-radius: 4px;
	  background-color: white;
     }
      .calendar-page-week {
          &:first-child {
              border-top: 1px solid gray;
          }
          margin: auto;
	  border-left: 1px solid gray;
          display: flex;
          flex: 0 1 auto;
	  border-bottom: 1px solid gray;
      }
      .calendar-page-day {
	  position: relative;
	  padding: 2rem;
	  display: flex;
          flex: 0 1 auto;
	  border-right: 1px solid gray;
	  height: 5rem;
	  width: 5rem;
	  padding: .25rem;
	  box-sizing: border-box;
      }
      .calendar-page-day.calendar-page-today {
	  font-weight: bold;
	  text-decoration: underline;
	  background: aliceblue;
      }
      .calendar-page-day.calendar-page-visit-day {
	  font-weight: bold;
	  text-decoration: underline;
	  background: lightyellow;
      }
      @media screen and (max-width: 676px) {
	  .calendar-page {
	      padding-left: 0;
	      padding-right: 0;
	  }
	  .calendar-page-day {
	      height: 3rem;
	      width: 3rem;
	  }
      }
      @media screen and (max-width: 400px) {
	  .calendar-page {
	  }
	  .calendar-page-day {
	      height: 2.5rem;
	      width: 2.5rem;
	  }
      }

  <script>
    function getCellElementByDay(day) {
	let match = false;
	document.querySelectorAll(".calendar-page-day").forEach((e) => {
	    if (e.innerText == "" + day) {
		match = e;
		return;
	    }
	});
	return match;
    }
    const today = new Date();
    let day = today.getDate();
    let month = today.getMonth();
    if (day > 16)
	day = 16;
    if (month != 9) {
	month = 9;
	day = 16;
    }
    const todayCell = getCellElementByDay(day);
    todayCell.classList.add("calendar-page-today");
    
  </script>
