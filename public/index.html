<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Morgan's Site</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="body-container">
      <div class="desktop-menubar">
	<div class="desktop-menubar-limit-width">
	  <div class="desktop-icon-group">
	    <div class="desktop-icon btn-effects">
	      <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24"><path d="M6 3h12v2H6zm0 16h12v2H6zM4 5h2v2H4zm5 0h2v2H9zm0 12h2v2H9zm4 0h2v2h-2zM7 7h2v10H7zm8 0h2v10h-2zm-2-2h2v2h-2zm7 0h-2v2h2zM2 7h2v10H2zm20 0h-2v10h2zM4 17h2v2H4zm16 0h-2v2h2z"/><path d="M3 11h18v2H3z"/></svg>
	    </div>
	    <div class="desktop-icon btn-effects">
	      <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24"><path d="M20 20H4v-2h16v2ZM4 18H2V6h2v12Zm18 0h-2V6h2v12Zm-8-4h-4v-2h4v2Zm-4-2H8v-2h2v2Zm6 0h-2v-2h2v2Zm-8-2H6V8h2v2Zm10 0h-2V8h2v2Zm2-4H4V4h16v2Z"/></svg>

	    </div>
	    <div class="desktop-icon btn-effects">
	      <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24"><path d="M20 20H4v-2h16v2ZM4 18H2V6h2v12Zm18 0h-2V8h2v10ZM20 8H10V6H4V4h8v2h8v2Z"/></svg>

	    </div>
	    <div class="desktop-icon btn-effects" onclick="open_blog()">
	      <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24"><path d="M2 3h9v2H2zM0 19h11v2H0zM13 3h9v2h-9zm0 16h11v2H13zM11 5h2v18h-2zM0 5h2v14H0zm22 0h2v14h-2zm-7 2h5v2h-5zm0 4h5v2h-5zm0 4h2v2h-2z"/></svg>
	    </div>
	  </div>
	  <div id="desktop-go-icon" class="desktop-icon
	  btn-effects">
	    <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24"><path d="M10 20h4v-6h2v6h4v2H4v-2h4v-6h2v6Zm-6 0H2V10h2v10Zm18 0h-2V10h2v10Zm-8-6h-4v-2h4v2Zm-8-4H4V8h2v2Zm14 0h-2V8h2v2ZM8 8H6V6h2v2Zm10 0h-2V6h2v2Zm-8-2H8V4h2v2Zm6 0h-2V4h2v2Zm-2-2h-4V2h4v2Z"/></svg>
	  </div>
	</div>
      </div>
      <div id="main-content">
	<div id="welcome-container">
	  <div id="welcome">
	    <div class="titlebar">
	      <span class="titlebar-title">welcome</span>
	      <button class="titlebar-button" id="close-ok"><svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24"><path d="M7 19H5v-2h2v2Zm12 0h-2v-2h2v2ZM9 15v2H7v-2h2Zm8 2h-2v-2h2v2Zm-6-2H9v-2h2v2Zm4 0h-2v-2h2v2Zm-2-2h-2v-2h2v2Zm-2-2H9V9h2v2Zm4 0h-2V9h2v2ZM9 9H7V7h2v2Zm8 0h-2V7h2v2ZM7 7H5V5h2v2Zm12 0h-2V5h2v2Z"/></svg></button>
	    </div>
	    <div class="flex-row" id="welcome-ok-container">
	      <div class="dialog-content">please feel free to look around</div>
	      <button id="welcome-ok" class="btn-effects boxshadow-effects">ok&nbsp;!</button>
	    </div>
	  </div>
	</div>
      </div>
    </div>
    <div id="dialog-base-el" class="dialog" style="display: none;">
      <div class="titlebar">
	<span class="titlebar-title">[title]</span>
	<button class="titlebar-button"><svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24"><path d="M7 19H5v-2h2v2Zm12 0h-2v-2h2v2ZM9 15v2H7v-2h2Zm8 2h-2v-2h2v2Zm-6-2H9v-2h2v2Zm4 0h-2v-2h2v2Zm-2-2h-2v-2h2v2Zm-2-2H9V9h2v2Zm4 0h-2V9h2v2ZM9 9H7V7h2v2Zm8 0h-2V7h2v2ZM7 7H5V5h2v2Zm12 0h-2V5h2v2Z"/></svg></button>
      </div>
      <div class="flex-row dialog-content-container" >
	<div class="dialog-content">[content goes here]</div>
	<button class="ok-button btn-effects boxshadow-effects">[button?]</button>
      </div>
    </div>
    <script src="morgan.js" ></script>
  </body>
</html>
