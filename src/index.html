<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Morgan's Site</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="body-container">
      <div class="desktop-menubar">
	<div class="desktop-menubar-limit-width">
	  <div class="desktop-icon-group">
	    <div class="desktop-icon"><img src="fireworks.svg" alt="a burst of lines" role="img" style="width: 2rem; height: 2rem;" /></div>
	    <div class="desktop-icon">email</div>
	    <div class="desktop-icon">file</div>
	  </div>
	  <div id="desktop-go-icon" class="desktop-icon">GO</div>
	</div>
      </div>
      <div id="welcome-container">
	<div id="welcome">
	  <div class="titlebar">
	    <span class="titlebar-title">welcome</span>
	    <button class="titlebar-button" id="close-ok">x</button>
	  </div>
	  <div class="flex-row" id="welcome-ok-container">
	    <span>please feel free to look around</span>
	    <button id="welcome-ok">ok&nbsp;!</button>
	  </div>
	</div>
      </div>
    </div>
    <script src="morgan.js" ></script>
  </body>
</html>
